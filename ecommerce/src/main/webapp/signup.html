<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        
        h2 {
            margin-top: 0;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
        }
        
        input[type="text"], input[type="password"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        .error {
            color: red;
            font-size: 12px;
        }
        
        p {
            margin: 10px 0 0;
        }
        
        a {
            color: #007bff;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Sign Up</h2>
        <c:if test="${not empty message}">
            <p class="error">${message}</p>
        </c:if>
        <form id="signUpForm" method="post" action="register" onsubmit="return validateForm()">
            <input type="hidden" name="direction" value="sign"/>
            
            <div class="form-group">
                <label for="signupUsername">Username:</label>
                <input type="text" id="signupUsername" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="signupadd">Email:</label>
                <input type="text" id="signupadd" name="email" required>
                <p class="error" id="emailError"></p>
            </div>
            
            <div class="form-group">
                <label for="signupphno">Phone number:</label>
                <input type="tel" id="signupphno" name="number" pattern="[0-9]{10}" required>
                <p class="error" id="phoneError"></p>
            </div>
            
            <div class="form-group">
                <label for="signupPassword">Password:</label>
                <input type="password" id="signupPassword" name="password" required>
                <p class="error" id="passwordError"></p>
            </div>
            
            <div class="form-group">
                <label for="signupConfirmPassword">Confirm Password:</label>
                <input type="password" id="signupConfirmPassword" name="confirmPassword" required>
                <p class="error" id="confirmPasswordError"></p>
            </div>
            
            <div class="form-check">
                <input type="checkbox" id="checkbox" name="check" required>
                <label for="checkbox">Check me out</label>
            </div>
            
            <button type="submit">Sign Up</button>
            <p>Already have an account? <a href="login2.jsp" id="showLogin">Login</a></p>
        </form>
    </div>
    
    <script>
        function validateForm() {
            let pw1 = document.getElementById("signupPassword").value;
            let pw2 = document.getElementById("signupConfirmPassword").value;
            let phone = document.getElementById("signupphno").value;
            let email = document.getElementById("signupadd").value;
            
            let emailError = document.getElementById("emailError");
            let phoneError = document.getElementById("phoneError");
            let passwordError = document.getElementById("passwordError");
            let confirmPasswordError = document.getElementById("confirmPasswordError");

            emailError.textContent = "";
            phoneError.textContent = "";
            passwordError.textContent = "";
            confirmPasswordError.textContent = "";

            let valid = true;

            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                emailError.textContent = "Please enter a valid email address.";
                valid = false;
            }

            // Phone number validation
            let phonePattern = /^[0-9]{10}$/;
            if (!phonePattern.test(phone)) {
                phoneError.textContent = "Please enter a 10-digit phone number.";
                valid = false;
            }

            // Strong Password validation
            let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passwordPattern.test(pw1)) {
                passwordError.textContent = "Password must be at least 8 characters, include 1 uppercase, 1 lowercase, 1 number, and 1 special character.";
                valid = false;
            }

            // Confirm Password validation
            if (pw1 !== pw2) {
                confirmPasswordError.textContent = "Passwords do not match.";
                valid = false;
            }

            return valid;
        }
    </script>
    
</body>
</html>
